# SwiftLint configuration for footstepeR (Stepper).
#
# Intentionally relaxed. The existing codebase is intentionally dense (many
# one-liners and stacked modifiers) and we don't want this PR to fail on
# pre-existing style. As we refactor in subsequent PRs we tighten rules.

included:
  - Stepper

excluded:
  - Stepper/Assets.xcassets
  - Stepper/PrivacyInfo.xcprivacy
  - Stepper/Localizable.xcstrings
  - Stepper.xcodeproj
  - scripts
  - docs
  - .build
  - DerivedData

disabled_rules:
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - large_tuple
  - identifier_name
  - type_name
  - nesting
  - trailing_whitespace
  - trailing_newline
  - todo
  - opening_brace
  - statement_position
  - multiple_closures_with_trailing_closure
  - shorthand_operator
  - redundant_string_enum_value
  - force_try
  - force_cast
  - unused_closure_parameter
  - redundant_optional_initialization
  - switch_case_alignment
  - implicit_getter
  - vertical_parameter_alignment
  - operator_whitespace
  - mark
  - non_optional_string_data_conversion
  - inclusive_language
  - private_over_fileprivate
  - control_statement
  - block_based_kvo
  - colon
  - comma
  - trailing_comma
  - leading_whitespace

reporter: "github-actions-logging"
