# SwiftLint configuration for footstepeR (Stepper).
# Relaxed to match the existing dense-style codebase. We re-enable rules
# incrementally as the code is refactored in later PRs.

included:
  - Stepper

excluded:
  - Stepper/Assets.xcassets
  - Stepper/PrivacyInfo.xcprivacy
  - Stepper.xcodeproj
  - scripts
  - docs
  - .build
  - DerivedData

disabled_rules:
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - large_tuple
  - identifier_name
  - type_name
  - nesting
  - trailing_whitespace
  - todo
  - opening_brace        # The codebase routinely uses one-line `}.modifier`
  - statement_position    # Same as above
  - multiple_closures_with_trailing_closure
  - shorthand_operator
  - redundant_string_enum_value

opt_in_rules:
  - empty_count
  - first_where
  - sorted_first_last
  - unused_import
  - unused_declaration
  - explicit_init
  - convenience_type
  - redundant_nil_coalescing

reporter: "github-actions-logging"
